{% extends "base.html" %}
{% from "macros.html" import csrf with context %}
{% block heading %}Passwort ändern{% endblock %}
{% block content %}
<form method="post" class="form narrow">
  {{ csrf() }}
  <label>Aktuelles Passwort <input type="password" name="current" required autocomplete="current-password"></label>
  <label>Neues Passwort <input type="password" name="new" required minlength="{{ min_length }}" autocomplete="new-password"></label>
  <label>Neues Passwort wiederholen <input type="password" name="repeat" required minlength="{{ min_length }}" autocomplete="new-password"></label>
  <button type="submit">Ändern</button>
</form>
{% endblock %}
