# https://wikitech.wikimedia.org/wiki/Help:Toolforge/Jobs_framework
# Deploy with: toolforge jobs load ~/toolforge_jobs.yaml  (diff against `toolforge jobs dump` first!)
---
##############################################################################
## Frequent jobs (Flask app, venv ~/www/python/venv)
- name: cronjob-update-mentees-rc
  command: sh ~/mp/jobs/run-python-job.sh update-rc
  image: python3.11
  schedule: "*/3  *   *   *   *"
  emails: onfailure
  filelog-stdout: logs/update-mentees-rc.out
  filelog-stderr: logs/update-mentees-rc.err
- name: refresh-comentors
  command: sh ~/mp/jobs/run-python-job.sh refresh-comentors
  image: python3.11
  schedule: "17,47  *   *   *   *"
  emails: onfailure
  filelog-stdout: logs/refresh-comentors.out
  filelog-stderr: logs/refresh-comentors.err
# mentorings from Kategorie:Benutzer:Mentee; SpBot's mp-helper (:00/:20/:40) writes the wiki lists afterwards
- name: sync-mentees
  command: sh ~/mp/jobs/run-python-job.sh sync-mentees
  image: python3.11
  schedule: "15,35,55  *   *   *   *"
  emails: onfailure
  filelog-stdout: logs/sync-mentees.out
  filelog-stderr: logs/sync-mentees.err
##############################################################################
## Daily jobs
- name: daily-log-cleanup
  command: sh ~/mp/jobs/remove-old-logs.sh
  image: bullseye
  schedule: "0 0  *   *   *"
  emails: onfailure
  filelog-stdout: logs/remove-old-logs.out
  filelog-stderr: logs/remove-old-logs.err
- name: create-database-dump
  command: bash ~/mp/jobs/create-database-dump.sh
  image: mariadb
  schedule: "0,10,20 0  *   *   *"
  emails: onfailure
  filelog-stdout: logs/create-database-dump.out
  filelog-stderr: logs/create-database-dump.err
- name: delete-old-database-dump
  command: sh ~/mp/jobs/delete-old-database-dump.sh
  image: bullseye
  schedule: "0 0  *   *   *"
  emails: onfailure
  filelog-stdout: logs/delete-old-database-dump.out
  filelog-stderr: logs/delete-old-database-dump.err
