name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        # same major version as ToolsDB
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      MP_TEST_DB_HOST: 127.0.0.1
      MP_TEST_DB_USER: root
      MP_TEST_DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Toolforge image python3.11
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check webapp tests
      - name: Tests (unit + integration against MariaDB)
        run: pytest -v --cov=mpweb --cov-report=term-missing
      - name: Smoke test – start the app and request pages
        env:
          MP_DB_HOST: 127.0.0.1
          WIKI_DB_HOST: 127.0.0.1
          MP_DB_NAME: mp_test
          WIKI_DB_NAME: wiki_test
          MP_DB_USER: root
          MP_DB_PASSWORD: root
          MP_SECRET_KEY: ci
          MP_INSECURE_COOKIES: "1"
          MP_DB_CNF: /nonexistent
        run: |
          # the test run leaves the last test's databases behind; use them as demo data
          cd webapp
          python -m flask --app app run --port 8000 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/info > /dev/null && break; sleep 1; done
          for path in / /info /mentoren /mentees /mentees/aenderungen /statistik /wartung/verlauf /api/mentors; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8000$path")
            echo "$path -> $code"
            test "$code" = 200
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' 'http://127.0.0.1:8000/index.php?action=stat')" = 301
